const EXPCAT = ['Passagem aérea','Hospedagem','Alimentação','Transporte/Táxi','Combustível/KM','Hospitality/Eventos','Outros'];
const EXPST = {rascunho:{l:'Rascunho',c:'gray'},aprovacao:{l:'Em aprovação',c:'amber'},aprovado:{l:'Aprovado',c:'blue'},pago:{l:'Reembolsado',c:'green'},reprovado:{l:'Reprovado',c:'red'}};
const EXP = {
  tab:'reembolsos',
  reembolsos:[],
  viagens:[],
  params:{ diariaNac:450, diariaInt:1200, km:1.60, prazo:30, tetos:{ 'Alimentação':120, 'Transporte/Táxi':200, 'Hospedagem':600 } }
};
/* alçadas de aprovação por valor da despesa/adiantamento */
function expChain(v){
  if(v<=2000) return [{role:'diretoria',label:'Diretoria'}];
  if(v<=10000) return [{role:'diretoria',label:'Diretoria'},{role:'dir_fin',label:'Diretoria Financeira'}];
  return [{role:'dir_fin',label:'Diretoria Financeira'},{role:'socio',label:'Sócios'}];
}
const expList = type => type==='viagem'?EXP.viagens:EXP.reembolsos;
const expFind = (id,type)=> expList(type).find(x=>x.id===id);
function expTab(t){ EXP.tab=t; go('reembolso'); }

function expNewReemb(){ openModal(`
  <div class="modal-head">${icon('receipt')} Nova despesa / reembolso <button class="modal-x" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="form-row"><label class="lbl">Descrição</label><input id="rb_t" class="nu-in" placeholder="Ex.: Táxi aeroporto — reunião BTG"></div>
    <div class="form-grid2">
      <div><label class="lbl">Categoria</label><select id="rb_cat" class="nu-in">${EXPCAT.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div><label class="lbl">Valor (R$)</label><input id="rb_val" class="nu-in" placeholder="0"></div>
      <div><label class="lbl">Data da despesa</label><input id="rb_data" type="date" class="nu-in"></div>
      <div><label class="lbl">Centro de custo</label><input id="rb_cc" class="nu-in" placeholder="Ex.: Comercial"></div>
    </div>
    <div class="form-row"><label class="lbl">Recibo / comprovante</label>
      <label class="upl"><input type="file" id="rb_file" style="display:none" onchange="document.getElementById('rb_fl').textContent=this.files[0]?this.files[0].name:'Nenhum arquivo'">${icon('clip')} Anexar comprovante</label>
      <div id="rb_fl" class="muted" style="font-size:11.5px;margin-top:6px">Nenhum arquivo</div></div>
    <div id="rb_msg" class="modal-msg"></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="expSaveReemb()">✓ Salvar despesa</button></div>
  </div>`,560); }
function expSaveReemb(){ const t=_v('rb_t'); if(!t){document.getElementById('rb_msg').textContent='Informe a descrição.';return;}
  const fl=document.getElementById('rb_file'); const recibo=fl&&fl.files[0]?fl.files[0].name:'';
  const val=_num('rb_val'); const teto=EXP.params.tetos[_v('rb_cat')];
  const alerta = teto && val>teto ? ` (acima do teto de ${money(teto)})` : '';
  EXP.reembolsos.unshift({id:Date.now(), type:'reembolso', colaborador:currentUser().name, titulo:t+alerta, cat:_v('rb_cat'), valor:val, data:(_v('rb_data')||'').split('-').reverse().join('/')||'—', cc:_v('rb_cc')||'—', recibo, status:'rascunho', approvals:[]});
  closeModal(); go('reembolso'); }

function expNewViagem(){ openModal(`

  <div class="modal-body">
    <div class="form-row"><label class="lbl">Destino</label><input id="vg_dest" class="nu-in" placeholder="Ex.: São Paulo — GP F1"></div>

    <div class="form-grid2">
      <div><label class="lbl">Ida</label><input id="vg_ida" type="date" class="nu-in"></div>
      <div><label class="lbl">Volta</label><input id="vg_volta" type="date" class="nu-in"></div>
      <div><label class="lbl">Adiantamento (R$)</label><input id="vg_adt" class="nu-in" placeholder="0"></div>
      <div><label class="lbl">Diárias previstas</label><input id="vg_dias" class="nu-in" placeholder="Ex.: 2"></div>
    </div>
    <div class="muted" style="font-size:11px;margin-top:6px">${icon('plane')} Diária nacional ${money(EXP.params.diariaNac)} · internacional ${money(EXP.params.diariaInt)} · R$/km ${EXP.params.km.toFixed(2)} · prestação de contas em ${EXP.params.prazo} dias.</div>
    <div id="vg_msg" class="modal-msg"></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="expSaveViagem()">✓ Solicitar viagem</button></div>
  </div>`,560); }
function expSaveViagem(){ const d=_v('vg_dest'); if(!d){document.getElementById('vg_msg').textContent='Informe o destino.';return;}
  const ida=(_v('vg_ida')||'').split('-').reverse().join('/'), volta=(_v('vg_volta')||'').split('-').reverse().join('/');
  EXP.viagens.unshift({id:Date.now(), type:'viagem', colaborador:currentUser().name, destino:d, motivo:_v('vg_mot')||'—', ida:ida||'—', volta:volta||'—', dias:_num('vg_dias'), valor:_num('vg_adt'), status:'rascunho', approvals:[]});
  closeModal(); go('reembolso'); }

function expSubmit(id,type){ const x=expFind(id,type); if(!x)return;
  x.approvals=expChain(x.valor||0).map(s=>({...s,ok:false,by:'',when:''})); x.status='aprovacao'; go('reembolso'); }
function expApprove(id,type){ const x=expFind(id,type); const step=x.approvals.find(s=>!s.ok); if(!step)return;
  const u=currentUser(); if(u.roleKey!==step.role && u.roleKey!=='admin'){ openModal(`<div class="modal-head">Sem alçada <button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="muted">Esta etapa exige aprovação de <strong style="color:var(--txt)">${step.label}</strong>. Seu perfil (${roleOf(u).label}) não tem alçada.</div><div class="modal-foot"><span></span><button class="btn primary" onclick="closeModal()">Entendi</button></div></div>`); return; }
  step.ok=true; step.by=u.name; step.when=nowStr(); if(x.approvals.every(s=>s.ok)) x.status='aprovado'; go('reembolso'); }
function expReject(id,type){ const x=expFind(id,type); x.status='reprovado'; go('reembolso'); }
function expPay(id,type){ const x=expFind(id,type); const u=currentUser(); if(u.roleKey!=='dir_fin'&&u.roleKey!=='admin'){ openModal(`<div class="modal-head">Sem alçada <button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="muted">Apenas a Diretoria Financeira (ou Admin) pode efetuar o reembolso.</div><div class="modal-foot"><span></span><button class="btn primary" onclick="closeModal()">Ok</button></div></div>`); return; } x.status='pago'; go('reembolso'); }

function expActions(x){
  const u=currentUser();
  if(x.status==='rascunho') return `<button class="btn" style="padding:6px 10px;font-size:11.5px" onclick="event.stopPropagation();expSubmit(${x.id},'${x.type}')">Enviar p/ aprovação</button>`;
  if(x.status==='aprovacao'){ const step=x.approvals.find(s=>!s.ok); const can=u.roleKey===step.role||u.roleKey==='admin';
    return can?`<button class="btn primary" style="padding:6px 10px;font-size:11.5px" onclick="event.stopPropagation();expApprove(${x.id},'${x.type}')">Aprovar (${step.label})</button>`:`<span class="muted" style="font-size:11px">Aguardando ${step.label}</span>`; }
  if(x.status==='aprovado') return `<button class="btn primary" style="padding:6px 10px;font-size:11.5px" onclick="event.stopPropagation();expPay(${x.id},'${x.type}')">Reembolsar</button>`;
  return `<span class="muted" style="font-size:11.5px">${EXPST[x.status].l}</span>`;
}

  if(EXP.tab==='viagens'){

      <thead><tr><th>Colaborador</th><th>Destino</th><th>Período</th><th>Motivo</th><th>Adiantamento</th><th>Status</th><th></th></tr></thead>
      <tbody>${V.length?V.map(x=>`<tr>
        <td class="strong">${av(ini(x.colaborador))}${x.colaborador}</td><td>${x.destino}</td>
        <td>${x.ida} – ${x.volta}</td><td>${x.motivo}</td><td class="strong">${money(x.valor)}</td>

      </tr>`).join(''):'<tr><td colspan="7" style="text-align:center;color:var(--txt-mute);padding:26px">Nenhuma viagem solicitada.</td></tr>'}</tbody>

  </table></div>`;
};
function expSaveParams(){ const p=EXP.params; p.diariaNac=_num('pp_dn'); p.diariaInt=_num('pp_di'); p.km=parseFloat((_v('pp_km')||'0').replace(',','.'))||p.km; p.prazo=_num('pp_pz')||p.prazo;
