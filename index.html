<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEYOND OS — Sistema de Gestão Centralizada</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B0B0C'/%3E%3Ctext x='50' y='74' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='72' fill='%23C6A664' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ============================================================
   BEYOND OS — Design Tokens (luxury brand system)
   ============================================================ */
:root{
  --bg:#0B0B0C;
  --bg-2:#101012;
  --panel:#16161A;
  --panel-2:#1C1C21;
  --line:#2A2A30;
  --line-soft:#222228;
  --txt:#F4F2EC;
  --txt-dim:#A7A39B;
  --txt-mute:#6F6C66;
  --gold:#C6A664;
  --gold-2:#E3CC93;
  --gold-soft:rgba(198,166,100,.12);
  --green:#4FA87E;
  --blue:#5B86B5;
  --red:#C25B53;
  --amber:#CDA04B;
  --purple:#8E7BB0;
  --teal:#5BA8A0;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --sans:'Inter',system-ui,sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--txt);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
::selection{background:var(--gold);color:#000}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c2c33;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#3a3a42}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}

.serif{font-family:var(--serif)}
.gold{color:var(--gold)}
.hidden{display:none!important}

/* ============================================================
   BEYOND wordmark logo (vector, transparent) — replaces text brand
   ============================================================ */
/* wordmark BEYOND em texto dourado */
.by-word{
  font-family:'Montserrat','Arial Black',Arial,sans-serif;font-weight:800;
  letter-spacing:.16em;color:var(--gold);display:inline-block;line-height:1;
  white-space:nowrap;padding-left:.16em;vertical-align:middle;
}
.by-word.light{color:#F4F2EC}
.by-word.dark{color:#0A0A0A}

/* seletor "Ver como" + barra de preview */
.viewas-sel{
  background:var(--panel);border:1px solid var(--line);color:var(--txt-dim);
  border-radius:10px;padding:8px 12px;font-size:12px;max-width:230px;cursor:pointer;
}
.viewas-sel:focus{outline:none;border-color:var(--gold)}
.preview-bar{
  display:flex;align-items:center;gap:10px;background:var(--gold-soft);
  border:1px solid rgba(198,166,100,.35);color:var(--gold-2);border-radius:12px;
  padding:11px 16px;margin-bottom:20px;font-size:12.5px;
}
.preview-bar .ico{font-size:15px}
.preview-bar strong{color:var(--txt)}
.preview-bar button{
  margin-left:auto;background:var(--gold);color:#1a1407;font-weight:600;font-size:11.5px;
  padding:6px 12px;border-radius:8px;
}
.nu-in{
  width:100%;padding:11px 13px;background:#0E0E10;color:var(--txt);
  border:1px solid var(--line);border-radius:10px;font-size:13px;
}
.nu-in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}

/* ============================================================
   GESTÃO DE PROJETOS
   ============================================================ */
.prj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.pcard{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.18s;position:relative}
.pcard:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:var(--shadow)}
.pcard-tags{display:flex;gap:6px;flex-wrap:wrap;min-height:20px;margin-bottom:6px}
.pcard-ring{display:flex;justify-content:center;margin:6px 0 10px}
.pcard-name{text-align:center;font-weight:600;font-size:15px;line-height:1.3;min-height:40px;display:flex;align-items:center;justify-content:center}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:12px 0;margin:8px 0}
.pstats > div{display:flex;flex-direction:column;align-items:center;gap:2px}
.pstats .ps-n{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1}
.pstats .ps-l{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--txt-mute)}
.pdates{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 0}
.pdates > div{display:flex;flex-direction:column;gap:2px}
.pdates .pd-l{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.pdates .pd-v{font-size:12px;color:var(--txt-dim)}
.pcompany{display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid var(--line-soft)}
.pcompany .pc-n{font-size:12.5px;font-weight:600}
.pcompany .pc-s{font-size:11px;color:var(--txt-mute)}
.pfoot{display:flex;justify-content:space-between;border-top:1px solid var(--line-soft);padding-top:10px;font-size:11.5px;color:var(--txt-mute)}

/* detalhe do projeto */
.prj-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.prj-back{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--txt-dim);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.prj-back:hover{border-color:var(--gold);color:var(--gold)}
.prj-back .ico{font-size:14px}
.prj-title{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1}
.prj-title .prj-sub{display:block;font-family:var(--sans);font-size:11.5px;color:var(--txt-mute);font-weight:400;margin-top:3px}
.prj-prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--gold);font-weight:600}
.prj-tabs{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line-soft);margin-bottom:20px;padding-bottom:0;flex-wrap:wrap}
.prj-tab{padding:10px 16px;font-size:13px;color:var(--txt-dim);border-bottom:2px solid transparent;font-weight:500}
.prj-tab:hover{color:var(--txt)}
.prj-tab.active{color:var(--gold-2);border-bottom-color:var(--gold)}
.phase-block{margin-bottom:22px}
.phase-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:12px 12px 0 0;padding:13px 16px}
.ph-code{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:15px}
.ph-name{font-weight:600;font-size:14px;margin-left:4px}
.ph-marco{font-size:11px;color:var(--txt-mute);margin-left:8px}
.ph-prog{font-size:11.5px;color:var(--txt-mute);display:flex;align-items:center;gap:8px}
table.ptask thead th{background:var(--bg-2)}
.tk-code{font-size:10.5px;color:var(--gold);font-weight:600;margin-right:6px}
.sit-sel{border:none;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:600;cursor:pointer;color:#fff}
.sit-sel:focus{outline:none}
.sit-sel.gray{background:#3a3a42}.sit-sel.blue{background:var(--blue)}.sit-sel.green{background:var(--green)}.sit-sel.red{background:var(--red)}
.sit-sel option{background:var(--panel);color:var(--txt)}
.add-task{padding:11px 16px;font-size:12.5px;color:var(--gold);cursor:pointer;border-top:1px solid var(--line-soft)}
.add-task:hover{background:var(--panel-2)}
.phase-empty{border:1px solid var(--line-soft);border-top:none;border-radius:0 0 12px 12px;padding:22px;text-align:center;color:var(--txt-mute);font-size:13px}
.link-btn{color:var(--gold);font-size:13px}
.prj-empty{text-align:center;padding:60px 20px;color:var(--txt-mute);display:flex;flex-direction:column;align-items:center;gap:14px}
.prj-empty .ico{font-size:40px;opacity:.5}

/* modais */
.modal-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{width:min(560px,96vw);max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:19px;font-weight:600;padding:20px 24px;border-bottom:1px solid var(--line-soft)}
.modal-x{margin-left:auto;font-size:16px;color:var(--txt-mute)}
.modal-x:hover{color:var(--red)}
.modal-body{padding:22px 24px}
.modal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.modal-msg{color:var(--red);font-size:12px;margin-top:10px;min-height:14px}
.form-row{margin-bottom:16px}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:6px}
.lbl{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-dim);margin-bottom:7px}
.wiz-steps{display:flex;gap:8px;padding:16px 24px 0}
.wstep{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--panel-2);color:var(--txt-mute);border:1px solid var(--line)}
.wstep.on{background:var(--gold);color:#1a1407;border-color:var(--gold)}
.wstep.done{background:var(--gold-soft);color:var(--gold-2);border-color:var(--gold)}
.wiz-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wiz-opt{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);color:var(--txt-dim);font-size:13px;font-weight:500}
.wiz-opt .ico{font-size:30px}
.wiz-opt:hover{border-color:var(--gold)}
.wiz-opt.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-2)}

/* ============================================================
   FUNIL DE VENDAS — barra de filtros + cards
   ============================================================ */
.funil-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.fb-field{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--gold)}
.fb-field .ico{font-size:14px}
.fb-field select{background:none;border:none;color:var(--txt);font-size:13px;padding:10px 4px;cursor:pointer;max-width:230px}
.fb-field select:focus{outline:none}
.fb-field select option{background:var(--panel);color:var(--txt)}
.fb-search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px;flex:1;min-width:220px}
.fb-search .ico{color:var(--txt-mute)}
.fb-search input{background:none;border:none;color:var(--txt);font-size:13px;padding:10px 0;width:100%}
.fb-search input:focus{outline:none}
.fb-toggle{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.fb-toggle button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;font-size:12.5px;color:var(--txt-dim)}
.fb-toggle button .ico{font-size:13px}
.fb-toggle button.on{background:var(--gold-soft);color:var(--gold-2)}
.kcol-body.drop-on{background:var(--gold-soft);outline:1.5px dashed var(--gold);outline-offset:-4px;border-radius:10px}
.kcol-empty{text-align:center;color:var(--txt-mute);font-size:18px;padding:8px}
.kc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.kc-pipe{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);padding:2px 7px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.flame{display:inline-flex;font-size:12px}
.flame.hot{color:var(--red)}.flame.warm{color:var(--amber)}.flame.cold{color:var(--blue)}
.kcard .meta .mline{margin-bottom:1px}
/* o card inteiro é o alvo de arraste/clique — evita que SVG/texto interno sequestrem o drag */
#funilBoard .kcard{cursor:grab}
#funilBoard .kcard *{pointer-events:none}
#funilBoard .kcard.dragging{opacity:.45;cursor:grabbing;border-color:var(--gold)}

/* ===== detalhe do negócio ===== */
.deal-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.deal-title{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.1}
.deal-title .deal-sub{display:block;font-family:var(--sans);font-size:11.5px;color:var(--txt-mute);font-weight:400;margin-top:3px}
.stagebar{display:flex;gap:4px;margin-bottom:20px}
.sb-seg{flex:1;height:30px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--txt-mute);position:relative}
.sb-seg.done{background:rgba(79,168,126,.25);border-color:var(--green)}
.sb-seg.cur{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1407;font-weight:600;border-color:var(--gold)}
.deal-grid{display:grid;grid-template-columns:300px 1fr 300px;gap:18px;align-items:start}
.deal-col{display:flex;flex-direction:column;gap:16px}
.dc-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.temps{display:flex;gap:6px;justify-content:space-between}
.temp{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line-soft);font-size:9.5px;color:var(--txt-mute)}
.temp .tf{font-size:15px;opacity:.5}
.temp:hover{border-color:var(--gold)}
.temp.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-2)}
.temp.on .tf{opacity:1;color:var(--gold)}
.orient{font-size:12.5px;color:var(--txt-dim);line-height:1.6;background:var(--bg-2);border:1px dashed var(--line);border-radius:10px;padding:12px}
.chk{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px;color:var(--txt-dim);cursor:pointer}
.chk input{accent-color:var(--gold);width:15px;height:15px}
.muted{color:var(--txt-mute)}
.aval-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--txt-dim);gap:10px}
.deal-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
.dtab{padding:9px 12px;font-size:12px;color:var(--txt-dim);border-bottom:2px solid transparent}
.dtab:hover{color:var(--txt)}
.dtab.on{color:var(--gold-2);border-bottom-color:var(--gold)}
.note-box{width:100%;min-height:70px;background:#0E0E10;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px;font-size:13px;resize:vertical}
.note-box:focus{outline:none;border-color:var(--gold)}
.tl-head{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-mute);margin:6px 0 12px;border-top:1px solid var(--line-soft);padding-top:14px}
.timeline{display:flex;flex-direction:column;gap:2px}
.tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.tl-item:last-child{border:none}
.tl-ic{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid var(--line);color:var(--gold);font-size:14px}
.tl-ic.win{background:rgba(79,168,126,.2);color:#7fcaa3;border-color:var(--green)}
.tl-ic.lose{background:rgba(194,91,83,.2);color:#df8a83;border-color:var(--red)}
.tl-ic.stage{background:var(--gold-soft);border-color:var(--gold)}
.tl-text{font-size:13px;color:var(--txt)}
.tl-meta{font-size:11px;color:var(--txt-mute);margin-top:3px}
.dd-row{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.dd-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-mute)}

/* ===== relatórios ===== */
.rep-stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.rep-stage{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:12px;text-align:center}
.rs-name{font-size:11.5px;font-weight:600;margin-bottom:10px;min-height:30px;display:flex;align-items:center;justify-content:center}
.rs-badges{display:flex;gap:4px;justify-content:center;margin-bottom:8px}
.rb{display:flex;flex-direction:column;align-items:center;font-size:14px;font-weight:700;color:#fff;border-radius:7px;padding:5px 7px;min-width:38px}
.rb small{font-size:8px;font-weight:500;opacity:.9;text-transform:uppercase;letter-spacing:.03em}
.rb.blue{background:var(--blue)}.rb.green{background:var(--green)}.rb.red{background:var(--red)}
.rs-val{font-size:12px;color:var(--gold);font-weight:600}
@media(max-width:1200px){.deal-grid{grid-template-columns:1fr}}

/* ===== filtro de data (relatórios e dashboards) ===== */
.df-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:10px 14px;margin-bottom:20px}
.df-bar .df-ic{color:var(--gold);display:inline-flex;font-size:15px}
.df-presets{display:flex;gap:4px;flex-wrap:wrap}
.df-presets button{padding:7px 12px;border-radius:8px;font-size:12px;color:var(--txt-dim);border:1px solid var(--line);background:var(--bg-2)}
.df-presets button:hover{border-color:var(--gold);color:var(--gold)}
.df-presets button.on{background:var(--gold-soft);color:var(--gold-2);border-color:var(--gold)}
.df-custom{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt-mute)}
.df-custom input[type=date]{background:#0E0E10;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 9px;font-size:12px;color-scheme:dark}
.df-custom input[type=date]:focus{outline:none;border-color:var(--gold)}
.df-custom .btn{padding:7px 12px;font-size:12px}
.df-lbl{margin-left:auto;font-size:11.5px;color:var(--gold);letter-spacing:.04em}

/* ===== Dashboard BI: toggles de gráfico + cabeçalhos ===== */
.chart-box{display:flex;flex-direction:column;height:350px}
.cb-canvas{position:relative;flex:1;min-height:0;width:100%}
.cb-canvas canvas{position:absolute!important;inset:0;width:100%!important;height:100%!important}
.cb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cb-head span{font-family:var(--serif);font-size:15px;font-weight:600}
.chart-toggle{display:flex;gap:3px}
.chart-toggle button{font-size:10.5px;padding:5px 9px;border-radius:7px;color:var(--txt-dim);border:1px solid var(--line);background:var(--bg-2)}
.chart-toggle button:hover{border-color:var(--gold);color:var(--gold)}
.chart-toggle button.on{background:var(--gold-soft);color:var(--gold-2);border-color:var(--gold)}
.bi-tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.bi-tag::after{content:"";flex:1;height:1px;background:var(--line-soft)}

/* ===== Impressão / PDF ===== */
@media print{
  .sidebar,.topbar,.df-bar,.page-actions,.chart-toggle{display:none!important}
  #app{display:block;height:auto}
  .main{grid-column:1;overflow:visible;padding:0}
  .main,.card,.chart-box,.kpi,.app-tile2,.table-wrap{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .chart-box{height:280px;break-inside:avoid}
  .two-col,.kpi-row{break-inside:avoid}
  @page{margin:12mm}
}

/* ===== Agenda ===== */
.gcal-bar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:12.5px;color:var(--txt-dim)}
.gcal-bar.on{border-color:rgba(78,118,166,.5)}
.gdot{width:9px;height:9px;border-radius:50%;background:#4E76A6;box-shadow:0 0 8px #4E76A6;flex:0 0 auto}
.cal-head{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wd{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-mute);text-align:center;padding-bottom:4px}
.cal-cell{min-height:74px;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-cell.empty{background:transparent;border:none}
.cal-cell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cal-d{font-size:11px;color:var(--txt-dim);font-weight:600}
.cal-ev{font-size:9px;color:#fff;border-radius:4px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-more{font-size:9px;color:var(--txt-mute)}
.dot-c{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}

/* ===== Chat ===== */
.chat-wrap{display:grid;grid-template-columns:280px 1fr;gap:0;border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;height:calc(100vh - 230px);min-height:440px;background:var(--panel)}
.chat-side{border-right:1px solid var(--line-soft);padding:14px;overflow-y:auto;background:var(--bg-2)}
.chat-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px;border-radius:10px;margin-bottom:3px}
.chat-item:hover{background:var(--panel)}
.chat-item.on{background:var(--gold-soft)}
.chat-ava{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:linear-gradient(135deg,#3a3a42,#23232a);color:var(--gold-2)}
.chat-ava.group{background:linear-gradient(135deg,var(--gold),#8a6f38);color:#1a1407}
.chat-ava .ico{font-size:16px}
.chat-meta{display:flex;flex-direction:column;min-width:0}
.chat-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-last{font-size:11px;color:var(--txt-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.chat-main{display:flex;flex-direction:column;min-width:0}
.chat-top{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line-soft)}
.chat-scroll{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:62%;align-self:flex-start;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:12px;padding:9px 13px;display:flex;flex-direction:column;gap:3px}
.bubble.me{align-self:flex-end;background:var(--gold-soft);border-color:rgba(198,166,100,.3)}
.b-from{font-size:10.5px;color:var(--gold);font-weight:600}
.b-text{font-size:13px;color:var(--txt);line-height:1.4}
.b-file{display:flex;align-items:center;gap:9px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.b-file .ico{color:var(--gold);font-size:16px}
.bf-n{font-size:12.5px;font-weight:600;display:block}
.bf-s{font-size:10.5px;color:var(--txt-mute)}
.b-h{font-size:9.5px;color:var(--txt-mute);align-self:flex-end}
.chat-compose{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line-soft)}
.chat-attach{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid var(--line);color:var(--txt-dim);cursor:pointer;flex:0 0 auto}
.chat-attach:hover{border-color:var(--gold);color:var(--gold)}
.chat-compose input{flex:1;background:#0E0E10;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 14px;font-size:13px}
.chat-compose input:focus{outline:none;border-color:var(--gold)}
.chat-send{width:42px;height:42px;border-radius:10px;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1407;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.chat-send .ico{font-size:17px}
@media(max-width:760px){.chat-wrap{grid-template-columns:1fr}.chat-side{display:none}}

/* ===== Chat flutuante (estilo Slack/Teams) ===== */
.chat-fab{position:fixed;right:24px;bottom:24px;z-index:300;width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1407;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.5);font-size:18px}
.chat-fab .ico{font-size:24px}
.chat-fab .fab-badge{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:20px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.chat-panel{position:fixed;right:24px;bottom:92px;z-index:300;width:360px;max-width:calc(100vw - 36px);height:520px;max-height:calc(100vh - 130px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
.cw-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line-soft);background:linear-gradient(120deg,#0E0E11,#1a1a1f)}
.cw-title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.cw-title .ico{color:var(--gold)}
.cw-x,.cw-back{margin-left:auto;color:var(--txt-mute);font-size:15px;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.cw-back{margin-left:0}
.cw-x:hover,.cw-back:hover{color:var(--gold)}
.cw-body{flex:1;overflow-y:auto;padding:14px}
.cw-list .chat-item{margin-bottom:3px}
.chat-panel .chat-scroll{display:flex;flex-direction:column;gap:9px}
.chat-panel .bubble{max-width:80%}
.chat-panel .chat-compose{padding:10px 12px}
@media(max-width:760px){.chat-panel{right:10px;left:10px;width:auto}}

/* ===== Marketing chips ===== */
.mk-chip{padding:8px 14px;border-radius:20px;font-size:12.5px;color:var(--txt-dim);border:1px solid var(--line);background:var(--panel)}
.mk-chip:hover{border-color:var(--gold);color:var(--gold)}
.mk-chip.on{background:var(--gold-soft);color:var(--gold-2);border-color:var(--gold)}
.mk-chip .mk-n{font-size:10px;background:var(--bg-2);border-radius:20px;padding:1px 6px;margin-left:4px}

/* ===== Upload + funil de aprovação (contratos) ===== */
.upl{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--txt-dim);font-size:12.5px;cursor:pointer}
.upl:hover{border-color:var(--gold);color:var(--gold)}
.upl .ico{font-size:15px}
.appr-flow{display:flex;flex-direction:column;gap:0}
.appr-step{display:flex;align-items:center;gap:12px;padding:12px 0;border-left:2px solid var(--line-soft);margin-left:13px;padding-left:18px;position:relative}
.appr-step .as-ic{position:absolute;left:-14px;width:26px;height:26px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--txt-mute)}
.appr-step.ok .as-ic{background:rgba(79,168,126,.25);border-color:var(--green);color:#7fcaa3}
.appr-step.cur .as-ic{background:var(--gold);border-color:var(--gold);color:#1a1407}
.as-l{font-size:13px;font-weight:600}
.as-m{font-size:11px;color:var(--txt-mute);margin-top:2px}

/* ===== YouTube embed ===== */
.yt-wrap{position:relative;width:100%;padding-bottom:56.25%;border-radius:10px;overflow:hidden;background:#000}
.yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play-badge{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:10px}

/* ============================================================
   LOGIN
   ============================================================ */
#login{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(198,166,100,.10), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(91,134,181,.08), transparent 55%),
    var(--bg);
}
.login-card{
  width:min(420px,92vw);
  background:linear-gradient(180deg,rgba(28,28,33,.9),rgba(16,16,18,.95));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:46px 40px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(8px);
}
.brand-lockup{text-align:center;margin-bottom:34px}
.brand-lockup .mark{
  font-family:var(--serif);font-weight:600;letter-spacing:.42em;
  font-size:30px;text-transform:uppercase;color:var(--txt);
  padding-left:.42em;
}
.brand-lockup .sub{
  margin-top:8px;font-size:10.5px;letter-spacing:.46em;
  text-transform:uppercase;color:var(--gold);
}
.brand-lockup .rule{
  width:46px;height:1px;background:var(--gold);margin:18px auto 0;opacity:.7;
}
.field{margin-bottom:18px}
.field label{
  display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--txt-dim);margin-bottom:8px;
}
.field input{
  width:100%;padding:13px 14px;background:#0E0E10;color:var(--txt);
  border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.btn-gold{
  width:100%;padding:14px;border-radius:var(--radius-sm);
  background:linear-gradient(180deg,var(--gold-2),var(--gold));
  color:#1a1407;font-weight:600;font-size:13px;letter-spacing:.12em;
  text-transform:uppercase;transition:transform .15s,filter .2s;
}
.btn-gold:hover{filter:brightness(1.06)}
.btn-gold:active{transform:translateY(1px)}
.login-hint{margin-top:20px;text-align:center;font-size:11px;color:var(--txt-mute);line-height:1.7}
.login-err{color:var(--red);font-size:12px;text-align:center;margin-top:14px;min-height:16px}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:none;height:100vh;grid-template-columns:248px 1fr;grid-template-rows:60px 1fr}
.sidebar{
  grid-row:1 / span 2;background:linear-gradient(180deg,#0E0E11,#0A0A0C);
  border-right:1px solid var(--line-soft);display:flex;flex-direction:column;
  padding:0;overflow-y:auto;
}
.side-brand{
  height:60px;display:flex;align-items:center;gap:12px;padding:0 22px;
  border-bottom:1px solid var(--line-soft);flex:0 0 auto;
}
.side-brand .mark{
  font-family:var(--serif);font-weight:600;letter-spacing:.32em;font-size:19px;
  text-transform:uppercase;padding-left:.32em;
}
.side-brand .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.nav{padding:16px 12px;flex:1}
.nav-label{
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt-mute);
  padding:14px 12px 8px;
}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  color:var(--txt-dim);font-size:13.5px;font-weight:500;transition:.15s;margin-bottom:2px;
  width:100%;text-align:left;
}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.active{background:var(--gold-soft);color:var(--gold-2)}
.nav-item .ic{width:18px;text-align:center;font-size:15px;opacity:.9}
.nav-item .badge{
  margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:600;
  padding:1px 7px;border-radius:20px;
}
.side-foot{padding:14px 18px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--txt-mute);flex:0 0 auto}

.topbar{
  grid-column:2;display:flex;align-items:center;gap:18px;padding:0 26px;
  background:var(--bg-2);border-bottom:1px solid var(--line-soft);
}
.crumb{font-family:var(--serif);font-size:22px;font-weight:600}
.crumb small{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-mute);display:block;margin-top:-2px}
.top-search{
  margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--panel);
  border:1px solid var(--line);border-radius:30px;padding:8px 16px;width:280px;
}
.top-search input{background:none;border:none;color:var(--txt);font-size:13px;width:100%}
.top-search input:focus{outline:none}
.top-search .ic{color:var(--txt-mute)}
.top-icon{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--line);font-size:15px;position:relative;transition:.15s;
}
.top-icon:hover{border-color:var(--gold);color:var(--gold)}
.top-icon .ping{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.avatar{
  width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#8a6f38);
  display:flex;align-items:center;justify-content:center;font-weight:600;color:#1a1407;font-size:14px;
}

.main{grid-column:2;overflow-y:auto;padding:30px 34px 60px}
.avatar{overflow:hidden;cursor:pointer;border:none;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-wrap{position:relative}
.user-menu{position:absolute;right:0;top:48px;z-index:250;width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;padding:6px}
.um-head{display:flex;align-items:center;gap:11px;padding:10px 10px 12px;border-bottom:1px solid var(--line-soft);margin-bottom:6px}
.um-name{font-size:13px;font-weight:600}
.um-role{font-size:11px;color:var(--gold)}
.um-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 11px;border-radius:9px;font-size:13px;color:var(--txt-dim)}
.um-item:hover{background:var(--panel-2);color:var(--txt)}
.um-item .ico{font-size:15px;color:var(--txt-mute)}
.um-item.um-out{color:#df8a83;border-top:1px solid var(--line-soft);margin-top:4px;border-radius:0 0 9px 9px}
.um-item.um-out .ico{color:#df8a83}
.bc-ava img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.bc-clickable{cursor:pointer;border-radius:0 0 var(--radius) var(--radius);transition:.15s}
.bc-clickable:hover{background:var(--panel-2)}
.bc-extra{font-size:11.5px;color:var(--txt-dim);margin-top:8px}
.bc-bio{color:var(--txt-mute);margin-top:4px;line-height:1.4}
.bc-edit{margin-top:12px;font-size:11px;color:var(--gold);display:inline-flex;align-items:center;gap:6px;opacity:.8}
.bc-edit .ico{font-size:12px}
.prof-ava{width:72px;height:72px;border-radius:50%;flex:0 0 auto;background:linear-gradient(135deg,var(--gold),#8a6f38);display:flex;align-items:center;justify-content:center;font-weight:600;color:#1a1407;font-size:24px;overflow:hidden}
.prof-ava img{width:100%;height:100%;object-fit:cover}

/* ============================================================
   SHARED COMPONENTS
   ============================================================ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px}
.page-head h1{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:.01em}
.page-head p{color:var(--txt-dim);font-size:13.5px;margin-top:4px}
.page-actions{display:flex;gap:10px}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;
  font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--txt);transition:.15s;
}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1407;border:none;font-weight:600}
.btn.primary:hover{filter:brightness(1.06);color:#1a1407}

.tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px;letter-spacing:.04em}
.tag.gold{background:var(--gold-soft);color:var(--gold-2)}
.tag.green{background:rgba(79,168,126,.16);color:#7fcaa3}
.tag.blue{background:rgba(91,134,181,.16);color:#8fb4dd}
.tag.red{background:rgba(194,91,83,.16);color:#df8a83}
.tag.amber{background:rgba(205,160,75,.16);color:#e0bf76}
.tag.purple{background:rgba(142,123,176,.18);color:#b6a6d8}
.tag.gray{background:#23232a;color:var(--txt-dim)}

.grid-cards{display:grid;gap:18px}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:20px}
.card.hoverable{transition:.18s;cursor:pointer}
.card.hoverable:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow)}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.kpi .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-mute)}
.kpi .val{font-family:var(--serif);font-size:34px;font-weight:600;margin-top:6px;line-height:1}
.kpi .delta{font-size:11.5px;margin-top:8px;color:var(--txt-dim)}
.kpi .delta.up{color:#7fcaa3}
.kpi .delta.down{color:#df8a83}

/* Console (home) app grid */
.console-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.app-tile{
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:22px 18px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;
  transition:.18s;position:relative;min-height:140px;text-align:left;
}
.app-tile:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:var(--shadow)}
.app-ic{
  width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#0c0c0c;
}
.app-tile .name{font-weight:600;font-size:14.5px;line-height:1.25}
.app-tile .desc{font-size:11.5px;color:var(--txt-mute);line-height:1.45}
.app-tile .count{
  position:absolute;top:14px;right:14px;background:var(--red);color:#fff;font-size:10.5px;
  font-weight:600;padding:1px 8px;border-radius:20px;
}

/* Kanban */
.kanban{display:flex;gap:16px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kcol{min-width:288px;max-width:288px;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--radius);display:flex;flex-direction:column}
.kcol-head{padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
.kcol-head .t{font-weight:600;font-size:13px}
.kcol-head .c{font-size:11px;color:var(--txt-mute);background:var(--panel);padding:1px 8px;border-radius:20px}
.kcol-head .money{font-size:10.5px;color:var(--gold);margin-top:2px}
.kcol-body{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:60px}
.kcard{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:13px;transition:.15s;cursor:grab}
.kcard:hover{border-color:var(--gold)}
.kcard .title{font-weight:600;font-size:13px;margin-bottom:8px;line-height:1.3}
.kcard .meta{font-size:11px;color:var(--txt-mute);display:flex;flex-direction:column;gap:3px}
.kcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.kcard .val{color:var(--gold);font-weight:600;font-size:12px}
.bar{height:5px;border-radius:5px;background:#23232a;overflow:hidden;margin-top:9px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2))}

/* Table */
.table-wrap{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  text-align:left;padding:13px 16px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;

}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line-soft);color:var(--txt-dim)}

.mini-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#3a3a42,#23232a);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--gold-2);margin-right:9px;vertical-align:middle}

/* Tickets list */
.ticket{display:flex;gap:16px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line-soft)}

/* Feed (comunicados / marketing) */
.feed-item{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line-soft)}
.feed-item:last-child{border-bottom:none}
.feed-click{cursor:pointer;border-radius:10px;transition:.15s;padding-left:8px;padding-right:8px;margin:0 -8px}
.feed-click:hover{background:var(--panel-2)}
.feed-ic{width:44px;height:44px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--gold-soft);color:var(--gold-2)}

.feed-body .fd{font-size:12.5px;color:var(--txt-dim);line-height:1.55}

/* Course cards */
.course{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;transition:.18s}

.course .banner{height:96px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;color:#0c0c0c;font-weight:600;letter-spacing:.04em}

.two-col{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.section-title{font-family:var(--serif);font-size:20px;font-weight:600;margin:6px 0 14px}

/* ---- SVG icon sizing ---- */
.ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}

   ============================================================ */

}

/* brand / profile card (right) */

.brand-card .bc-top{
  background:linear-gradient(120deg,#0E0E11,#1a1a1f);padding:26px 22px 22px;

}
.brand-card .bc-mark{font-family:var(--serif);font-weight:600;letter-spacing:.34em;font-size:23px;text-transform:uppercase;padding-left:.34em}
.brand-card .bc-mark .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:9px;vertical-align:middle;box-shadow:0 0 8px var(--gold)}

.brand-card .bc-ava{
  width:64px;height:64px;border-radius:50%;margin:0 auto 12px;border:3px solid var(--panel);
  background:linear-gradient(135deg,var(--gold),#8a6f38);display:flex;align-items:center;justify-content:center;

/* section labels */

/* featured */

.banner-img{
  width:248px;height:150px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;color:#fff
}

/* comunicados list */
.comu-card{
  background:var(--panel);border:1px solid var(--line-soft);border-left:3px solid var(--gold);

}

.news-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}

.news-card{position:relative}
.news-del{position:absolute;top:8px;right:8px;z-index:3;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;display:none;align-items:center;justify-content:center}
.news-card:hover .news-del{display:flex}
.news-del:hover{background:var(--red)}
.bi-cap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:10px 14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
.ft-prev{margin-top:10px;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;min-height:54px;display:flex;align-items:center;justify-content:center;background:var(--bg-2)}
.ft-prev img{width:100%;max-height:150px;object-fit:cover;display:block}
.news-card .nbody{padding:16px}
.news-card .nbody h4{font-size:13.5px;font-weight:600;line-height:1.35;margin-bottom:7px}
.news-card .nbody p{font-size:11.5px;color:var(--txt-mute);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

@media(max-width:1300px){.tiles{grid-template-columns:repeat(5,1fr)}}
@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}
  .console-top,.console-mid{grid-template-columns:1fr}.news-grid{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){#app{grid-template-columns:1fr}.sidebar{display:none}.topbar,.main{grid-column:1}
  .news-grid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(3,1fr)}.featured .fbody{flex-direction:column}.banner-img{width:100%}}
</style>
</head>
<body>

<script>
/* ============================================================
   BEYOND OS — Application Logic
   ============================================================ */

/* ---- Auth (prototype-only; production uses hashed creds + API) ---- */
const USERS = [
  { name:"Dimitri de Melo", email:"dimicx2@gmail.com", password:"Dimi@1008",
    role:"Administrador Principal", initials:"DM", scope:"Brasil", admin:true, roleKey:"admin" }
];

/* ---- Papéis / categorias de acesso (RBAC) ----
   deny = módulos bloqueados para o papel. Admin não bloqueia nada. */
const ROLES = {
  admin:    { label:'Admin',                         deny:[] },
  socio:    { label:'Sócios',                         deny:['usuarios'] },
  diretoria:{ label:'Diretoria',                      deny:['usuarios','financeiro'] },
  dir_fin:  { label:'Diretoria Financeira',           deny:['usuarios'] },
  equipe:   { label:'Equipe Brasil',                  deny:['usuarios','financeiro'] },
};

const ini = n => n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const currentUser = ()=> sessionState.viewAs || sessionState.user;
const roleOf = u => ROLES[(u&&u.roleKey)] || ROLES.equipe;
const isAdmin = ()=> currentUser() && currentUser().roleKey==='admin';
const realIsAdmin = ()=> !!(sessionState.user && sessionState.user.roleKey==='admin');
function canAccess(appId){
  const app = APPS.find(a=>a.id===appId);
  if(!app) return true;
  return !roleOf(currentUser()).deny.includes(appId);
}

function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass  = document.getElementById('password').value;
  const u = USERS.find(x=>x.email.toLowerCase()===email && x.password===pass);
  const err = document.getElementById('loginErr');
  if(!u){ err.textContent = "Credenciais inválidas. Verifique e-mail e senha."; return false; }
  err.textContent="";
  sessionState.user = u;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='grid';
  document.getElementById('userAvatar').textContent = u.initials;
  buildNav(); go('console');
  return false;
}

const sessionState = { user:null, route:'console', viewAs:null };

/* ============================================================
   Filtro de data compartilhado (relatórios e dashboards)
   ============================================================ */
const MONTHS = [
  {key:'Jan', d:'2026-01-15', rev:0, cin:0, cout:0},
  {key:'Fev', d:'2026-02-15', rev:0, cin:0, cout:0},
  {key:'Mar', d:'2026-03-15', rev:0, cin:0, cout:0},
  {key:'Abr', d:'2026-04-15', rev:0, cin:0, cout:0},
  {key:'Mai', d:'2026-05-15', rev:0, cin:0, cout:0},
  {key:'Jun', d:'2026-06-15', rev:0, cin:0, cout:0},
];
const DF = { preset:'ano', from:'', to:'' };
function parseDate(s){ if(!s) return null; if(/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s+'T00:00:00'); const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/); return m? new Date(+m[3],+m[2]-1,+m[1]) : null; }
function dfRange(){
  const now=new Date(); let from, to=now;
  if(DF.preset==='custom'){ from=parseDate(DF.from)||new Date(2000,0,1); to=parseDate(DF.to)||now; }
  else if(DF.preset==='7'){ from=new Date(now); from.setDate(now.getDate()-7); }
  else if(DF.preset==='30'){ from=new Date(now); from.setDate(now.getDate()-30); }
  else if(DF.preset==='mes'){ from=new Date(now.getFullYear(),now.getMonth(),1); }
  else if(DF.preset==='ano'){ from=new Date(now.getFullYear(),0,1); to=new Date(now.getFullYear(),11,31); }
  else { from=new Date(2000,0,1); to=new Date(2100,0,1); }
  to=new Date(to.getFullYear(),to.getMonth(),to.getDate(),23,59,59);
  return {from,to};
}
function inDF(dateStr){ if(DF.preset==='tudo') return true; const d=parseDate(dateStr); if(!d) return true; const r=dfRange(); return d>=r.from && d<=r.to; }
function monthsInDF(){ const ms=MONTHS.filter(m=>inDF(m.d)); return ms.length?ms:MONTHS; }
function dfSet(p){ DF.preset=p; go(sessionState.route); }
function dfApplyCustom(){ const f=document.getElementById('df_from'),t=document.getElementById('df_to'); if(f&&t){DF.from=f.value;DF.to=t.value;DF.preset='custom';} go(sessionState.route); }
function dfLabel(){ return {'7':'Últimos 7 dias','30':'Últimos 30 dias','mes':'Este mês','ano':'Este ano','tudo':'Todo o período','custom':(DF.from||'…')+' a '+(DF.to||'…')}[DF.preset]||''; }
function dfBarHTML(){
  const presets=[['7','7 dias'],['30','30 dias'],['mes','Este mês'],['ano','Este ano'],['tudo','Tudo']];
  return `<div class="df-bar">
    <span class="df-ic">${icon('calendar')}</span>
    <div class="df-presets">${presets.map(p=>`<button class="${DF.preset===p[0]?'on':''}" onclick="dfSet('${p[0]}')">${p[1]}</button>`).join('')}</div>
    <div class="df-custom">De <input type="date" id="df_from" value="${DF.from}"> até <input type="date" id="df_to" value="${DF.to}"> <button class="btn" onclick="dfApplyCustom()">Aplicar</button></div>
    <span class="df-lbl">${dfLabel()}</span>
  </div>`;
}

/* ---- Professional SVG icon library (no emojis) ---- */
const ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  chart:'<path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="12" width="3" height="5" rx="0.5"/><rect x="12" y="8" width="3" height="9" rx="0.5"/><rect x="17" y="5" width="3" height="12" rx="0.5"/>',
  project:'<rect x="3" y="4" width="5" height="16" rx="1.2"/><rect x="10" y="4" width="5" height="10" rx="1.2"/><rect x="17" y="4" width="4" height="13" rx="1.2"/>',
  funnel:'<path d="M3 5h18l-7 8v6l-4 2v-8L3 5z"/>',
  crown:'<path d="M3 7l4 4 5-6 5 6 4-4v10H3z"/><path d="M3 19h18"/>',
  b2b:'<rect x="3" y="9" width="8" height="11" rx="1"/><rect x="13" y="4" width="8" height="16" rx="1"/><path d="M6 12h2M6 15h2M16 8h2M16 11h2M16 14h2"/>',
  ticket:'<path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/>',
  megaphone:'<path d="M3 11v2a1 1 0 0 0 1 1h2l3 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M9 6l9-3v18l-9-3"/><path d="M18 9a3 3 0 0 1 0 6"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  cap:'<path d="M12 4 2 9l10 5 10-5-10-5z"/><path d="M6 11v5c0 1 3 2.5 6 2.5s6-1.5 6-2.5v-5"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
  user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',

function buildNav(){
  const nav = document.getElementById('nav');
  const groups = {};
  APPS.filter(a=>canAccess(a.id)).forEach(a=>{ (groups[a.group]=groups[a.group]||[]).push(a); });
  let html = '';
  for(const g in groups){
    html += `<div class="nav-label">${g}</div>`;
    groups[g].forEach(a=>{
      html += `<button class="nav-item" data-id="${a.id}" onclick="go('${a.id}')">
        <span class="ic">${icon(a.icon)}</span>${a.name}
        ${a.badge?`<span class="badge">${a.badge}</span>`:''}
      </button>`;
    });
  }
  nav.innerHTML = html;
  document.getElementById('sideLogo').innerHTML = logo(20);
  document.getElementById('searchIc').innerHTML = icon('search');
  // seletor "Ver como" (somente para o administrador real)
  const sel = document.getElementById('viewAs');
  if(realIsAdmin()){
    sel.classList.remove('hidden');
    sel.innerHTML = `<option value="__self">Ver como… (Admin)</option>`
      + DATA.usuarios.filter(u=>!u.admin).map(u=>`<option value="${u.email}"${sessionState.viewAs&&sessionState.viewAs.email===u.email?' selected':''}>${u.nome} — ${roleOf(u).label}</option>`).join('');
  } else { sel.classList.add('hidden'); }
  document.getElementById('btnBell').insertAdjacentHTML('beforeend', icon('bell'));
  document.getElementById('btnCal').innerHTML = icon('calendar');
  renderChatWidget();
}

function go(id){
  if(!canAccess(id)){ id='console'; } // bloqueio por papel/categoria de acesso
  sessionState.route = id;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.id===id));
  const app = APPS.find(a=>a.id===id);
  document.getElementById('crumb').innerHTML = `${app.name} <small>${app.desc}</small>`;
  updateAvatars();
  document.getElementById('view').scrollTop=0;
  let body = VIEWS[id]();
  if(sessionState.viewAs){
    body = `<div class="preview-bar">${icon('user')} Pré-visualizando como <strong>${currentUser().name}</strong> · ${roleOf(currentUser()).label}
      <button onclick="setViewAs('__self')">Voltar ao Admin</button></div>` + body;
  }

  if(id==='dashboard') drawDashboardCharts();

  document.querySelector('.main').scrollTo(0,0);
}

function setViewAs(email){
  if(!realIsAdmin()) return;
  if(email==='__self' || !email){ sessionState.viewAs=null; }
  else {
    const u = DATA.usuarios.find(x=>x.email===email);
    sessionState.viewAs = u ? {name:u.nome, initials:ini(u.nome), role:u.papel, roleKey:u.roleKey, email:u.email, scope:u.escopo, admin:!!u.admin} : null;
  }
  buildNav();
  go('console');
}

function addUser(){
  if(!isAdmin()) return;
  const g = id => document.getElementById(id);
  const nome=g('nu_nome').value.trim(), email=g('nu_email').value.trim().toLowerCase();
  const rk=g('nu_role').value, dep=g('nu_dep').value.trim()||'—', esc=g('nu_esc').value.trim()||'Brasil';
  const pass=g('nu_pass').value, pass2=g('nu_pass2').value;
  const msg=g('nu_msg');
  if(!nome||!email||!/.+@.+\..+/.test(email)){ msg.textContent='Informe nome e e-mail válidos.'; return; }
  if(DATA.usuarios.some(u=>u.email===email)){ msg.textContent='Já existe um usuário com este e-mail.'; return; }
  if(!pass || pass.length<8){ msg.textContent='A senha deve ter ao menos 8 caracteres.'; return; }
  if(pass!==pass2){ msg.textContent='As senhas não conferem.'; return; }
  DATA.usuarios.push({nome, email, papel:ROLES[rk].label, roleKey:rk, dep, escopo:esc, status:'Ativo', s:'green', acesso:'nunca', admin:rk==='admin'});
  // habilita o login do novo usuário
  USERS.push({name:nome, email, password:pass, role:ROLES[rk].label, initials:ini(nome), scope:esc, admin:rk==='admin', roleKey:rk});
  go('usuarios');
}

/* lighten/darken a hex color */
function shade(hex,amt){
  let c=hex.replace('#','');
  let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

/* Geração de PDF real (jsPDF + html2canvas) */
async function generatePDF(){
  const node=document.getElementById('view'); const btn=document.getElementById('pdfBtn');
  if(!window.jspdf || typeof html2canvas==='undefined'){ window.print(); return; }
  const old=btn?btn.innerHTML:''; if(btn){btn.innerHTML='Gerando PDF…'; btn.disabled=true;}
  try{
    const canvas=await html2canvas(node,{backgroundColor:'#0B0B0C',scale:2,useCORS:true,windowWidth:node.scrollWidth});
    const { jsPDF }=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const iw=pw, ih=canvas.height*pw/canvas.width;
    const img=canvas.toDataURL('image/png');
    let left=ih, pos=0;
    pdf.addImage(img,'PNG',0,0,iw,ih);
    left-=ph;
    while(left>0){ pos-=ph; pdf.addPage(); pdf.addImage(img,'PNG',0,pos,iw,ih); left-=ph; }
    pdf.save('BEYOND-Dashboard.pdf');
  }catch(e){ window.print(); }
  finally{ if(btn){btn.innerHTML=old; btn.disabled=false;} }
}

function drawDashboardCharts(){
  if(typeof Chart==='undefined') return;
  const grid='#23232a', tick='#A7A39B', gold='#C6A664';
  Chart.defaults.color=tick; Chart.defaults.font.family="'Inter',sans-serif";
  const ms=monthsInDF();
  const dealsDF=FUNIL.deals.filter(d=>inDF(d.created)).map(ensureDeal);
  const fcounts=FSTAGES.map(s=>dealsDF.filter(d=>d.stage===s).length);
  const stageCols=['#5B86B5','#5BA8A0','#CDA04B','#C6A664','#E3CC93','#4FA87E'];
  const mk=(id,cfg)=>{ const el=document.getElementById(id); if(el) new Chart(el,cfg); };
  const axes={scales:{y:{grid:{color:grid}},x:{grid:{color:grid}}},maintainAspectRatio:false,plugins:{legend:{display:false}}};

  // Receita: linha / área / barra
  const revType=DASH.rev==='bar'?'bar':'line';
  mk('chRevenue',{type:revType,data:{labels:ms.map(m=>m.key),
      datasets:[{label:'Receita (R$ M)',data:ms.map(m=>m.rev),borderColor:gold,backgroundColor:DASH.rev==='area'?'rgba(198,166,100,.15)':(DASH.rev==='bar'?gold:'rgba(198,166,100,0)'),fill:DASH.rev==='area',tension:.4,borderWidth:2,borderRadius:6,pointBackgroundColor:gold}]},options:axes});

  // Funil: barra / pizza
  if(DASH.fun==='pie'){ mk('chFunnel',{type:'pie',data:{labels:FSTAGES,datasets:[{data:fcounts,backgroundColor:stageCols,borderColor:'#16161A',borderWidth:2}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'right'}}}}); }
  else { mk('chFunnel',{type:'bar',data:{labels:FSTAGES,datasets:[{data:fcounts,backgroundColor:stageCols,borderRadius:6}]},options:axes}); }

  // LTV por tier: barra / linha
  const tg=ltvByTier();
  mk('chLTV',{type:DASH.ltv==='line'?'line':'bar',data:{labels:tg.map(x=>x.t),datasets:[{label:'LTV médio',data:tg.map(x=>Math.round(x.avg/1000)),backgroundColor:['#C6A664','#8E7BB0','#CDA04B'],borderColor:gold,borderRadius:6,tension:.4}]},options:{...axes,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'R$ '+c.raw+'k'}}}}});

  // Modalidade: rosca / barra
  const mod={labels:['Futebol','F1','Tênis','Basquete','Outros'],data:[42,28,14,9,7],cols:['#C6A664','#5B86B5','#4FA87E','#8E7BB0','#C25B53']};
  if(DASH.mod==='bar'){ mk('chEvents',{type:'bar',data:{labels:mod.labels,datasets:[{data:mod.data,backgroundColor:mod.cols,borderRadius:6}]},options:axes}); }
  else { mk('chEvents',{type:'doughnut',data:{labels:mod.labels,datasets:[{data:mod.data,backgroundColor:mod.cols,borderColor:'#16161A',borderWidth:3}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right'}}}}); }

const prjAllTasks = p => p.phases.reduce((a,f)=>a.concat(f.tasks),[]);

function ring(pct){
  const r=33, c=2*Math.PI*r, off=c*(1-pct/100);
  const col = pct>=100?'#4FA87E':pct>0?'#C6A664':'#3a3a42';
  return `<svg width="90" height="90" viewBox="0 0 90 90">
    <circle cx="45" cy="45" r="${r}" fill="none" stroke="#23232a" stroke-width="8"/>
    <circle cx="45" cy="45" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 45 45)"/>
    <text x="45" y="52" text-anchor="middle" font-size="22" fill="#F4F2EC" font-family="'Cormorant Garamond',serif" font-weight="600">${pct}</text>
  </svg>`;
}

  const msg=document.getElementById('tk_msg');
  if(!name){ msg.textContent='Informe o nome da tarefa.'; return; }
  ph.tasks.push({code:'T'+String(prjAllTasks(p).length+1).padStart(2,'0'), name, resp, dur:dur||'1 dia', i:i||'—', f:f||'—', done: sit==='green'?(f||'—'):'', s:sit});
  PRJ.modal=null; go('projetos');
}
function setSit(pid,fi,ti,sk){
  const p=PRJ.projects.find(x=>x.id===pid); const t=p.phases[fi].tasks[ti];
  t.s=sk; if(sk==='green'&&!t.done) t.done=t.f; if(sk!=='green') t.done='';
  go('projetos');
}

function prjDetail(){
  const p=PRJ.projects.find(x=>x.id===PRJ.current);

  const tabs=[['fases','Fases'],['tarefas','Tarefas'],['gantt','Linha do tempo'],['equipe','Equipe']];
  const head = `
    <div class="prj-head">
      <button class="prj-back" onclick="prjBack()">${icon('grid')} Voltar aos projetos</button>
      <div class="prj-title">${p.name}<span class="prj-sub">${p.company} · Responsável: ${p.owner} · Data projetada: ${p.proj}</span></div>
      <div class="prj-prog"><div class="bar" style="width:120px"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>
    </div>
    <div class="prj-tabs">
      ${tabs.map(t=>`<button class="prj-tab ${PRJ.tab===t[0]?'active':''}" onclick="prjTab('${t[0]}')">${t[1]}</button>`).join('')}
      <button class="btn primary" style="margin-left:auto" onclick="prjOpenModal('phase')">+ Nova Fase</button>
    </div>`;

  if(PRJ.tab==='gantt') return head + prjGantt(p);
  if(PRJ.tab==='equipe') return head + prjTeam(p);
  if(PRJ.tab==='tarefas') return head + prjFlatTasks(p);
  // fases (default)
  if(!p.phases.length){
    return head + `<div class="prj-empty">${icon('project')}<div>Ainda não há fases criadas neste projeto.</div>
      <button class="btn primary" onclick="prjOpenModal('phase')">+ Criar Fase</button></div>`;
  }
  const pi = PRJ.projects.indexOf(p);
  const phases = p.phases.map((f,fi)=>{
    const done=f.tasks.filter(t=>t.s==='green').length, total=f.tasks.length;
    const fpct= total? Math.round(done/total*100):0;
    return `<div class="phase-block">
      <div class="phase-head" style="border-left:4px solid ${f.color}">
        <div><span class="ph-code">${f.code}</span> <span class="ph-name">${f.name}</span> <span class="ph-marco">Marco: ${f.marco}</span></div>
        <div class="ph-prog">${done} de ${total} Tarefas <span class="tag ${fpct===100?'green':'gray'}">${fpct}%</span></div>
      </div>
      ${total? `<div class="table-wrap" style="border-radius:0 0 12px 12px">
        <table class="ptask">
          <thead><tr><th>Tarefa</th><th>Responsável</th><th>Duração</th><th>Dt. Início</th><th>Dt. Fim</th><th>Conclusão</th><th>Situação</th></tr></thead>
          <tbody>${f.tasks.map((t,ti)=>`<tr>
            <td><span class="tk-code">${t.code}</span> <span class="strong">${t.name}</span></td>
            <td>${av(ini(t.resp))}${t.resp}</td>

            <td>${t.done||'—'}</td>

              ${SIT.map(o=>`<option value="${o.k}"${o.k===t.s?' selected':''}>${o.l}</option>`).join('')}
            </select></td>
          </tr>`).join('')}</tbody>
        </table>
        <div class="add-task" onclick="prjOpenModal('task','${f.code}')">+ Adicionar Tarefa</div>

    </div>`;
  }).join('');

function prjFlatTasks(p){
  const rows = p.phases.flatMap((f,fi)=>f.tasks.map((t,ti)=>({f,fi,t,ti})));
  if(!rows.length) return `<div class="prj-empty">${icon('project')}<div>Nenhuma tarefa neste projeto.</div></div>`;
  return `<div class="table-wrap"><table class="ptask">
    <thead><tr><th>Tarefa</th><th>Fase</th><th>Responsável</th><th>Duração</th><th>Dt. Fim</th><th>Situação</th></tr></thead>

      <td><span class="tk-code">${r.t.code}</span> <span class="strong">${r.t.name}</span></td>
      <td><span class="tag gray">${r.f.code} ${r.f.name}</span></td>
      <td>${av(ini(r.t.resp))}${r.t.resp}</td>
      <td>${r.t.dur}</td><td>${r.t.f}</td>
      <td><select class="sit-sel ${r.t.s}" onchange="setSit(${p.id},${r.fi},${r.ti},this.value)">
        ${SIT.map(o=>`<option value="${o.k}"${o.k===r.t.s?' selected':''}>${o.l}</option>`).join('')}
      </select></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function prjGantt(p){
  const tasks=prjAllTasks(p);
  if(!tasks.length) return `<div class="prj-empty">${icon('project')}<div>Sem tarefas para exibir na linha do tempo.</div></div>`;

const FUNIL = {
  pipeline:'todos', seller:'todos', q:'', view:'kanban', modal:null, editId:null,
  deals:[]
};

const crmTier = name => { const c=DATA.crm.find(x=>x.name===name); return c?c.tier:null; };
function funilFiltered(){
  return FUNIL.deals.filter(d=>
    (FUNIL.pipeline==='todos' || d.pipe===FUNIL.pipeline) &&
    (FUNIL.seller==='todos' || d.owner===FUNIL.seller) &&
    (!FUNIL.q || (d.title+' '+d.customer).toLowerCase().includes(FUNIL.q.toLowerCase()))
  );
}
function funilSet(k,v){ FUNIL[k]=v; go('funil'); }
function funilSearch(v){ FUNIL.q=v; const board=document.getElementById('funilBoard'); if(board){ renderFunilBoard(); } }
function funilOpen(id){ if(window._fDragged) return; const d=FUNIL.deals.find(x=>x.id===id); ensureDeal(d); FUNIL.editId=id; FUNIL.view='deal'; go('funil'); }
function funilBackToBoard(){ FUNIL.view='kanban'; FUNIL.editId=null; go('funil'); }
function funilNew(){ FUNIL.editId=null; FUNIL.modal='new'; go('funil'); }
function funilCloseModal(){ FUNIL.modal=null; go('funil'); }
function funilSave(){
  const g=id=>document.getElementById(id);
  const title=g('fd_title').value.trim();
  if(!title){ g('fd_msg').textContent='Informe o título do negócio.'; return; }
  const obj={title, pipe:g('fd_pipe').value, stage:g('fd_stage').value, owner:g('fd_owner').value,
    customer:g('fd_cust').value, value:parseInt(g('fd_value').value.replace(/\D/g,''))||0, temp:g('fd_temp').value};
  if(FUNIL.modal==='edit'){ Object.assign(FUNIL.deals.find(d=>d.id===FUNIL.editId), obj); }
  else { obj.id=Math.max(0,...FUNIL.deals.map(d=>d.id))+1; obj.days=0; obj.upd=0; FUNIL.deals.unshift(obj); }
  FUNIL.modal=null; go('funil');
}
function funilDelete(){ FUNIL.deals=FUNIL.deals.filter(d=>d.id!==FUNIL.editId); FUNIL.modal=null; go('funil'); }
function funilMove(id,stage){
  const d=FUNIL.deals.find(x=>x.id===id);
  if(d){ ensureDeal(d);
    if(d.stage!==stage){ d.timeline.unshift({type:'stage',text:`Etapa alterada: ${d.stage} → ${stage}`,who:currentUser().name,when:nowStr()}); }
    d.stage=stage; d.days=0; if(stage==='Ganho') d.status='ganho';
  }
  go('funil');
}
function nowStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
/* inicializa campos estendidos do negócio (estilo SULTS) sob demanda */
const TEMP5=['Gelado','Frio','Morno','Quente','Ardente'];
const ORIENT={
  'Novo Lead':'Faça o primeiro contato e qualifique o interesse do lead o quanto antes.',
  'Contato':'Mande uma mensagem no WhatsApp e agende uma atividade para a segunda tentativa de contato amanhã.',
  'Proposta':'Envie a proposta personalizada e registre o envio com data de follow-up.',
  'Negociação':'Negocie condições, alinhe expectativas e defina a data prevista de fechamento.',
  'Fechamento':'Finalize o contrato, confirme o pagamento e prepare o onboarding.',
  'Ganho':'Negócio ganho! Inicie o onboarding do cliente e registre no CRM.'
};
const STAGE_CHECKS={
  'Novo Lead':['O lead tem perfil?','Dados de contato confirmados?'],
  'Contato':['Primeiro contato realizado?','Necessidade identificada?'],
  'Proposta':['Proposta enviada?','Cliente confirmou recebimento?'],
  'Negociação':['Condições alinhadas?','Decisor envolvido?'],
  'Fechamento':['Contrato assinado?','Pagamento confirmado?'],
  'Ganho':['Onboarding agendado?']
};
const STAGE_EVAL={
  'Novo Lead':'Perfil qualificado?','Contato':'Interesse confirmado?','Proposta':'Proposta aderente?',
  'Negociação':'Fechamento provável?','Fechamento':'Tudo pronto para ganhar?','Ganho':'Cliente satisfeito?'
};
function ensureDeal(d){
  if(!d || d._init) return d;
  d._init=true;
  d.status = d.status || (d.stage==='Ganho'?'ganho':'aberto');
  d.tempIdx = d.tempIdx!=null ? d.tempIdx : (d.temp==='hot'?4:d.temp==='warm'?2:1);
  d.checks = d.checks || {};   // {stage:[boolIndices]}
  d.tags = d.tags || [];
  d.origem = d.origem || 'Sem origem';
  d.marca = d.marca || 'BEYOND';
  d.campanha = d.campanha || 'Sem campanha';
  d.cidade = d.cidade || '';
  d.estado = d.estado || '';
  d.person = d.person || d.customer || '';
  d.company = d.company || '';
  d.participants = d.participants || [];
  d.timeline = d.timeline || [{type:'create',text:'Negócio criado',who:d.owner,when:'—'}];
  return d;
}

  let body;
  if(FUNIL.view==='relatorios') body = funilReport();
  else if(FUNIL.view==='lista') body = `<div id="funilBoard">${funilListHTML()}</div>`;
  else body = `<div class="kanban" id="funilBoard">${funilBoardHTML()}</div>`;
  return ctrls + body + funilModalHTML();
};

/* drag & drop persistente */
function fDragStart(e,id){
  window._fDragId=id; window._fDragged=false;
  try{ e.dataTransfer.setData('text/plain',String(id)); e.dataTransfer.effectAllowed='move'; }catch(_){}
  if(e.currentTarget&&e.currentTarget.classList) e.currentTarget.classList.add('dragging');
}
function fDragEnd(e){ window._fDragged=true; setTimeout(()=>{window._fDragged=false;},250);
  document.querySelectorAll('.kcard.dragging').forEach(c=>c.classList.remove('dragging')); }
function fDrop(e,el){
  e.preventDefault(); el.classList.remove('drop-on');
  let id=parseInt(e.dataTransfer.getData('text/plain'),10);
  if(isNaN(id)) id=window._fDragId;
  if(id!=null) funilMove(id, el.dataset.stage);
}

function funilReport(){
  const base = FUNIL.deals.filter(d=>(FUNIL.pipeline==='todos'||d.pipe===FUNIL.pipeline) && (FUNIL.seller==='todos'||d.owner===FUNIL.seller) && inDF(d.created)).map(ensureDeal);
  const dfbar = dfBarHTML();
  const abertos=base.filter(d=>d.status==='aberto');
  const ganhos=base.filter(d=>d.status==='ganho');
  const perdidos=base.filter(d=>d.status==='perdido');
  const stageRow = s => {
    const inS=base.filter(d=>d.stage===s);
    return {ab:inS.filter(d=>d.status==='aberto').length, ga:inS.filter(d=>d.status==='ganho').length, pe:inS.filter(d=>d.status==='perdido').length, val:inS.reduce((a,d)=>a+d.value,0)};
  };
  const sellers=[...new Set(base.map(d=>d.owner))];
  return `
  ${dfbar}
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="label">${icon('funnel')} Abertos</div><div class="val">${abertos.length}</div><div class="delta">${money(abertos.reduce((a,d)=>a+d.value,0))}</div></div>
    <div class="kpi"><div class="label">▲ Ganhos</div><div class="val" style="color:#7fcaa3">${ganhos.length}</div><div class="delta up">${money(ganhos.reduce((a,d)=>a+d.value,0))}</div></div>
    <div class="kpi"><div class="label">▼ Perdidos</div><div class="val" style="color:#df8a83">${perdidos.length}</div><div class="delta down">${money(perdidos.reduce((a,d)=>a+d.value,0))}</div></div>
  </div>

  <div class="card" style="margin-bottom:20px">
    <div class="section-title" style="margin-top:0">Etapas do funil ${FUNIL.pipeline==='todos'?'(todos)':'· '+FUNIL.pipeline}</div>
    <div class="rep-stages">
      ${FSTAGES.map(s=>{const r=stageRow(s); return `<div class="rep-stage">
        <div class="rs-name">${s}</div>
        <div class="rs-badges"><span class="rb blue">${r.ab}<small>Aberto</small></span><span class="rb green">${r.ga}<small>Ganho</small></span><span class="rb red">${r.pe}<small>Perdido</small></span></div>
        <div class="rs-val">${money(r.val)}</div>
      </div>`;}).join('')}
    </div>
  </div>

  <div class="two-col">
    <div class="chart-box"><div class="cb-head"><span>Valor por etapa</span></div><div class="cb-canvas"><canvas id="repChart"></canvas></div></div>

      <div class="section-title" style="margin-top:0">Negócios por responsável</div>
      <div class="table-wrap" style="border:none">
        <table>
          <thead><tr><th>Responsável</th><th>Aberto</th><th>Ganho</th><th>Perdido</th><th>Total</th></tr></thead>
          <tbody>${sellers.map(s=>{const ds=base.filter(d=>d.owner===s);
            const ab=ds.filter(d=>d.status==='aberto').length,ga=ds.filter(d=>d.status==='ganho').length,pe=ds.filter(d=>d.status==='perdido').length;
            return `<tr><td class="strong">${av(ini(s))}${s}</td><td><span class="tag blue">${ab}</span></td><td><span class="tag green">${ga}</span></td><td><span class="tag red">${pe}</span></td><td class="strong">${ds.length}</td></tr>`;}).join('')}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}
function drawFunilReport(){

  const base=FUNIL.deals.filter(d=>(FUNIL.pipeline==='todos'||d.pipe===FUNIL.pipeline) && (FUNIL.seller==='todos'||d.owner===FUNIL.seller) && inDF(d.created)).map(ensureDeal);

    options:{plugins:{legend:{display:false},title:{display:true,text:'Valor por etapa (R$ mil)',color:'#F4F2EC',font:{size:14,weight:'600'}}},scales:{y:{grid:{color:'#23232a'}},x:{grid:{color:'#23232a'}}},maintainAspectRatio:false}});

function chatToggleWidget(){ CHAT.open=!CHAT.open; if(CHAT.open){ CHAT.unread=0; } renderChatWidget(); if(CHAT.open) setTimeout(chatScrollBottom,30); }
function chatSel(id){ CHAT.current=id; CHAT.wview='thread'; renderChatWidget(); setTimeout(chatScrollBottom,30); }
function chatBackList(){ CHAT.wview='list'; renderChatWidget(); }
function chatScrollBottom(){ const b=document.getElementById('chatScroll'); if(b)b.scrollTop=b.scrollHeight; }
function chatSend(){ const el=document.getElementById('chatInput'); if(!el)return; const v=el.value.trim(); if(!v)return; CHAT.convos.find(x=>x.id===CHAT.current).msgs.push({from:'me',t:v,h:nowStr().split(' ')[1]}); renderChatWidget(); setTimeout(chatScrollBottom,30); }
function chatKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); chatSend(); } }
function chatFile(inp){ if(!inp.files||!inp.files[0])return; const f=inp.files[0]; const kb=Math.max(1,Math.round(f.size/1024)); CHAT.convos.find(x=>x.id===CHAT.current).msgs.push({from:'me',file:{n:f.name,s:kb>1024?(kb/1024).toFixed(1)+' MB':kb+' KB'},h:nowStr().split(' ')[1]}); renderChatWidget(); setTimeout(chatScrollBottom,30); }
function chatNew(){ CHAT.wview='new'; renderChatWidget(); }
function chatStart(name){ let c=CHAT.convos.find(x=>x.name===name); if(!c){ c={id:Date.now(),name,type:'dm',msgs:[]}; CHAT.convos.unshift(c);} CHAT.current=c.id; CHAT.wview='thread'; renderChatWidget(); setTimeout(chatScrollBottom,30); }
/* abre o chat direto numa conversa (usado pela Gestão de Crise) */
function chatOpenConvo(name,type,members){ let c=CHAT.convos.find(x=>x.name===name); if(!c){ c={id:Date.now(),name,type:type||'group',members:members||[],msgs:[]}; CHAT.convos.unshift(c);} CHAT.current=c.id; CHAT.open=true; CHAT.wview='thread'; renderChatWidget(); setTimeout(chatScrollBottom,30); return c; }

function renderChatWidget(){
  const root=document.getElementById('chatWidget'); if(!root) return;
  if(!sessionState.user){ root.innerHTML=''; return; }
  const launcher=`<button class="chat-fab" onclick="chatToggleWidget()" title="Chat">${CHAT.open?'✕':icon('chat')}${(!CHAT.open&&CHAT.unread)?`<span class="fab-badge">${CHAT.unread}</span>`:''}</button>`;
  if(!CHAT.open){ root.innerHTML=launcher; return; }
  const c=CHAT.convos.find(x=>x.id===CHAT.current)||CHAT.convos[0];
  let panel;
  if(CHAT.wview==='list'){
    panel=`<div class="cw-head"><span class="cw-title">${icon('chat')} Mensagens</span><button class="cw-x" onclick="chatToggleWidget()">✕</button></div>
      <div class="cw-body cw-list">
        <button class="btn primary" style="width:100%;margin-bottom:10px" onclick="chatNew()">+ Nova conversa</button>
        ${CHAT.convos.map(cv=>{const last=cv.msgs[cv.msgs.length-1]; return `<button class="chat-item" onclick="chatSel(${cv.id})"><span class="chat-ava ${cv.type}">${cv.type==='group'?icon('users'):ini(cv.name)}</span><span class="chat-meta"><span class="chat-name">${cv.name}</span><span class="chat-last">${last?(last.file?'📎 '+last.file.n:last.t):'—'}</span></span></button>`;}).join('')}
      </div>`;
  } else if(CHAT.wview==='new'){
    panel=`<div class="cw-head"><button class="cw-back" onclick="chatBackList()">←</button><span class="cw-title">Nova conversa</span><button class="cw-x" onclick="chatToggleWidget()">✕</button></div>
      <div class="cw-body cw-list"><ul class="list-clean">${DATA.usuarios.filter(u=>u.email!==currentUser().email).map(u=>`<li style="cursor:pointer" onclick="chatStart('${u.nome}')"><span>${av(ini(u.nome))}${u.nome}</span><span class="tag gray">${u.dep}</span></li>`).join('')}</ul></div>`;
  } else {
    const bubbles=c.msgs.map(m=>`<div class="bubble ${m.from==='me'?'me':''}">${m.from!=='me'?`<span class="b-from">${m.from}</span>`:''}${m.file?`<a class="b-file">${icon('clip')}<span><span class="bf-n">${m.file.n}</span><span class="bf-s">${m.file.s}</span></span></a>`:`<span class="b-text">${m.t}</span>`}<span class="b-h">${m.h}</span></div>`).join('');
    panel=`<div class="cw-head"><button class="cw-back" onclick="chatBackList()">←</button><span class="chat-ava ${c.type}" style="width:28px;height:28px">${c.type==='group'?icon('users'):ini(c.name)}</span><span class="cw-title" style="flex:1">${c.name}</span><button class="cw-x" onclick="chatToggleWidget()">✕</button></div>
      <div class="cw-body chat-scroll" id="chatScroll">${bubbles||'<div class="muted" style="text-align:center;padding:20px">Inicie a conversa.</div>'}</div>
      <div class="chat-compose">
        <label class="chat-attach" title="Enviar arquivo">${icon('clip')}<input type="file" onchange="chatFile(this)" style="display:none"></label>
        <input id="chatInput" placeholder="Mensagem…" onkeydown="chatKey(event)">
        <button class="chat-send" onclick="chatSend()">${icon('send')}</button>
      </div>`;
  }
  root.innerHTML=launcher+`<div class="chat-panel">${panel}</div>`;
}
