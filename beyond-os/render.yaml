# Render Blueprint — BEYOND OS (web service + PostgreSQL)
# Suba este repositório no Render e use "New > Blueprint".
services:
  - type: web
    name: beyond-os
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beyond-os-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: dimicx2@gmail.com
      - key: ADMIN_NAME
        value: Dimitri de Melo
      - key: ADMIN_PASSWORD
        sync: false        # defina manualmente no painel do Render (secreto)
      - key: NODE_ENV
        value: production

databases:
  - name: beyond-os-db
    plan: starter
    region: oregon
